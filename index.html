<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neetseries</title>

<style>
body{
  margin:0;
  background:#fff;
  font-family:Arial, sans-serif;
  color:#111;
}

header{
  text-align:center;
  padding:24px 10px 10px;
}
header h1{
  margin:0;
  font-family:"Times New Roman", Times, serif;
  font-size:44px;
}
.subfoot{
  margin-top:6px;
  font-size:14px;
  color:#666;
  text-transform:lowercase;
}

.quote{
  max-width:900px;
  margin:12px auto 20px;
  text-align:center;
  font-family:"Times New Roman", Times, serif;
  font-size:18px;
  color:#444;
}
.quote span{
  display:block;
  margin-top:8px;
  font-size:14px;
  color:#666;
}

.controls{
  max-width:900px;
  margin:0 auto 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
}

button{
  padding:8px 16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
}
#startBtn{ background:#2563eb; color:#fff; }
#submitBtn{ background:#16a34a; color:#fff; }
#submitBtn:disabled{ background:#9ca3af; cursor:not-allowed; }

#timer{
  font-weight:700;
  font-size:16px;
}

.exam{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:20px;
  padding:10px 12px 40px;
}
.column{
  width:50%;
  border-right:1px solid #ddd;
  padding-right:12px;
}
.column:last-child{
  border-right:none;
  padding-left:12px;
}

.card{
  padding:12px 4px;
  border-bottom:1px solid #e5e7eb;
}

.toprow{
  display:flex;
  gap:8px;
  margin-bottom:6px;
}

.diff{
  font-size:12px;
  padding:2px 10px;
  border-radius:999px;
  font-weight:600;
}
.easy{ background:#dcfce7; color:#166534; }
.medium{ background:#ffedd5; color:#9a3412; }
.hard{ background:#fee2e2; color:#991b1b; }

.type{
  font-size:12px;
  padding:2px 10px;
  border-radius:999px;
  background:#f3f4f6;
}

.q{
  font-weight:700;
  margin-bottom:6px;
  white-space:pre-line;
}

.opt{
  display:block;
  background:none;
  border:none;
  padding:4px 0;
  cursor:pointer;
  color:#1d4ed8;
  text-align:left;
}
.opt:hover{ text-decoration:underline; }

.correct{ color:green; font-weight:700; }
.wrong{ color:red; font-weight:700; }

#popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
}
#popbox{
  background:#fff;
  max-width:520px;
  margin:12% auto;
  padding:16px;
  border-radius:10px;
}
#close{
  float:right;
  cursor:pointer;
  font-size:13px;
  color:#555;
}
</style>
</head>

<body>

<header>
  <h1>Neetseries</h1>
  <div class="subfoot">an atcg publication</div>
</header>

<div class="quote">
  “It’s not that I’m so smart, it’s just that I stay with problems longer.”
  <span>— Albert Einstein</span>
</div>

<div class="controls">
  <button id="startBtn">Begin Test</button>
  <div id="timer">⏱ 16:00</div>
  <button id="submitBtn" disabled>Submit</button>
</div>

<div class="exam">
  <div class="column" id="left"></div>
  <div class="column" id="right"></div>
</div>

<div id="popup">
  <div id="popbox">
    <span id="close">Close</span>
    <h3 id="popTitle"></h3>
    <p id="popText"></p>
  </div>
</div>

<script>
const Q = [
 {t:"MCQ",d:"Easy",q:"Powerhouse of the cell is:",o:["Ribosome","Mitochondria","Golgi body","Lysosome"],a:1,e:"ATP production"},
 {t:"MCQ",d:"Medium",q:"DNA replication occurs during:",o:["G1","S","G2","M"],a:1,e:"S phase"},
 {t:"MCQ",d:"Easy",q:"Vitamin C deficiency causes:",o:["Rickets","Beriberi","Scurvy","Night blindness"],a:2,e:"Scurvy"},
 {t:"MCQ",d:"Medium",q:"Functional unit of kidney:",o:["Neuron","Nephron","Alveolus","Hepatocyte"],a:1,e:"Nephron"},
 {t:"A/R",d:"Medium",q:"Assertion: Heart is myogenic\nReason: SA node initiates impulse",
  o:["Both true and R explains A","Both true but R doesn't","A true R false","A false R true"],a:0,e:"SA node causes myogenic beat"},
 {t:"MCQ",d:"Easy",q:"Oxygen in photosynthesis comes from:",o:["CO2","Water","Glucose","Chlorophyll"],a:1,e:"Photolysis"},
 {t:"A/R",d:"Hard",q:"Assertion: Photorespiration reduces yield\nReason: RuBisCO binds O2",
  o:["Both true and R explains A","Both true but R doesn't","A true R false","A false R true"],a:0,e:"Oxygenase activity"},
 {t:"MCQ",d:"Easy",q:"Cell membrane is:",o:["Cellulose","Phospholipid bilayer","Starch","Chitin"],a:1,e:"Fluid mosaic"}
];

function shuffle(a){return a.sort(()=>Math.random()-0.5);}
let TEST = shuffle([...Q]).slice(0,16);
let answers = Array(TEST.length).fill(null);
let time = 16*60, timer, started=false;

const left=document.getElementById("left");
const right=document.getElementById("right");

function render(){
 left.innerHTML=""; right.innerHTML="";
 TEST.forEach((q,i)=>{
  let card=document.createElement("div");
  card.className="card";
  card.id="q"+i;
  card.innerHTML=`
   <div class="toprow">
    <div class="diff ${q.d.toLowerCase()}">${q.d}</div>
    <div class="type">${q.t}</div>
   </div>
   <div class="q">${i+1}. ${q.q}</div>`;
  q.o.forEach((op,j)=>{
   let b=document.createElement("button");
   b.className="opt";
   b.textContent=String.fromCharCode(65+j)+". "+op;
   b.onclick=()=>select(i,j);
   card.appendChild(b);
  });
  (i<8?left:right).appendChild(card);
 });
}

function select(i,j){
 if(!started || answers[i]!=null) return;
 answers[i]=j;
}

function startTimer(){
 timer=setInterval(()=>{
  time--;
  document.getElementById("timer").textContent=
   "⏱ "+Math.floor(time/60)+":"+String(time%60).padStart(2,"0");
  if(time<=0) submit();
 },1000);
}

function submit(){
 clearInterval(timer);
 let score=0;
 TEST.forEach((q,i)=>{
  let opts=document.querySelectorAll("#q"+i+" .opt");
  opts[q.a].classList.add("correct");
  if(answers[i]==null) return;
  if(answers[i]==q.a) score+=4;
  else{
    score-=1;
    opts[answers[i]].classList.add("wrong");
  }
 });
 showPopup("Test Completed","Score: "+score+"\n\nAnswers and explanations are now visible.");
}

function showPopup(t,txt){
 document.getElementById("popTitle").innerText=t;
 document.getElementById("popText").innerText=txt;
 document.getElementById("popup").style.display="block";
}
document.getElementById("close").onclick=()=>document.getElementById("popup").style.display="none";
document.getElementById("popup").onclick=e=>{if(e.target.id==="popup")close();};

document.getElementById("startBtn").onclick=()=>{
 started=true;
 document.getElementById("submitBtn").disabled=false;
 startTimer();
};

document.getElementById("submitBtn").onclick=submit;

render();
</script>

</body>
</html>
